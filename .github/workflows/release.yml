# Builds portable Windows and macOS releases of TotalMix Access.
#
#   Push a tag v*  -> builds both platforms and publishes a GitHub release with the zips.
#   Manual run     -> builds both platforms and keeps the zips as workflow artifacts.
#
# wxWidgets comes from vcpkg in classic mode (as on the development machine), with static
# triplets so the app needs no extra DLLs or dylibs. vcpkg's binary cache is kept between runs.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
  VCPKG_COMMIT: master

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Get vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT checkout $env:VCPKG_COMMIT
          "VCPKG_SHA=$(git -C $env:VCPKG_ROOT rev-parse HEAD)" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force "${{ github.workspace }}\vcpkg-cache" | Out-Null
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-windows-static-${{ env.VCPKG_SHA }}
          restore-keys: vcpkg-windows-static-

      - name: Install wxWidgets
        run: '& "$env:VCPKG_ROOT\vcpkg.exe" install wxwidgets:x64-windows-static'

      - name: Configure
        run: >
          cmake -S . -B build/win -G "Visual Studio 17 2022" -A x64
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build
        run: cmake --build build/win --config Release --parallel

      - name: Test
        run: ctest --test-dir build/win -C Release --output-on-failure

      - name: Package
        shell: bash
        run: |
          version=$(sed -nE 's/^project\(TotalMixAccess VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          dir="TotalMixAccess-$version-windows-x64"
          mkdir "$dir"
          cp build/win/Release/TotalMixAccess.exe README.md LICENSE "$dir/"
          7z a "$dir.zip" "$dir"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: TotalMixAccess-*-windows-x64.zip

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Get vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$VCPKG_COMMIT"
          echo "VCPKG_SHA=$(git -C "$VCPKG_ROOT" rev-parse HEAD)" >> "$GITHUB_ENV"
          mkdir -p "${{ github.workspace }}/vcpkg-cache"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-macos-${{ env.VCPKG_SHA }}
          restore-keys: vcpkg-macos-

      - name: Install wxWidgets (arm64 and x86_64)
        run: |
          brew install autoconf automake libtool nasm || true
          "$VCPKG_ROOT/vcpkg" install wxwidgets:arm64-osx wxwidgets:x64-osx

      - name: Build arm64 and x86_64
        run: |
          for arch in arm64 x86_64; do
            if [ "$arch" = arm64 ]; then triplet=arm64-osx; else triplet=x64-osx; fi
            cmake -S . -B "build/$arch" -G Xcode \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
              -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_TARGET_TRIPLET=$triplet \
              -DCMAKE_OSX_ARCHITECTURES=$arch
            cmake --build "build/$arch" --config Release --parallel
          done

      - name: Test
        run: ctest --test-dir build/arm64 -C Release --output-on-failure

      - name: Package universal app
        run: |
          version=$(sed -nE 's/^project\(TotalMixAccess VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          dir="TotalMixAccess-$version-macos-universal"
          mkdir "$dir"
          app="$dir/TotalMix Access.app"
          ditto build/arm64/Release/TotalMixAccess.app "$app"
          bin="$app/Contents/MacOS/TotalMixAccess"
          lipo -create build/arm64/Release/TotalMixAccess.app/Contents/MacOS/TotalMixAccess \
                       build/x86_64/Release/TotalMixAccess.app/Contents/MacOS/TotalMixAccess \
               -output "$bin"
          lipo -info "$bin"
          codesign --force --deep --sign - "$app"
          cp README.md LICENSE "$dir/"
          ditto -c -k --keepParent "$dir" "$dir.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: TotalMixAccess-*-macos-universal.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Portable builds of TotalMix Access, an accessible OSC remote for RME TotalMix FX. No installer: unzip and run.

          **Windows (x64):** unzip and run `TotalMixAccess.exe`. Settings are saved in `%APPDATA%\TotalMixAccess\settings.xml`.

          **macOS 11 or later (Apple silicon and Intel):** unzip and move `TotalMix Access.app` wherever you like. The app is not notarized, so the first time, Control-click it and choose Open, or run `xattr -dr com.apple.quarantine "TotalMix Access.app"`.

          See the README in each zip for setting up OSC in TotalMix FX.
          EOF
          gh release create "$GITHUB_REF_NAME" TotalMixAccess-*.zip \
            --repo "$GITHUB_REPOSITORY" --title "TotalMix Access ${GITHUB_REF_NAME#v}" --notes-file notes.md
